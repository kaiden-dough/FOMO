name: fomo
description: "Host events, RSVP immediately, and never miss a night out again. Discover what's happening around you, see who's going, and get on the list before it's too late. Whether you're throwing the party or looking for one — FOMO has you covered."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  uuid: ^4.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/FOMO_logo.png

flutter_native_splash:
  color: "#000000"
  image: assets/FOMO_logo.png
  android: true
  ios: true
