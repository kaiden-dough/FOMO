# Create only the candidate service. The existing fomo-bk8f service stays blue.
# Select this Blueprint path in Render after publishing the feature branch.
services:
  - type: web
    name: fomo-auth-green
    runtime: python
    plan: free
    repo: https://github.com/kaiden-dough/FOMO
    branch: codex/google-oauth-blue-green
    rootDir: fomo/backend
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://getnexkcsoihpkrdcqli.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_MODE
        value: google
      - key: DEPLOYMENT_COLOR
        value: green
